name: Build APK

on:

push:

workflow_dispatch:

jobs:

build:

runs-on: ubuntu-latest

steps:

uses: actions/checkout@v4

actions/setup-java@v4

distribution: temurin java-version: '17'

uses: subosito/flutter-action@v2

with

channel: stable

run: flutter create --platforms=android --org com.test fondblanc

un: cp main.dart fondblanc/lib/main.dart

run: flutter build apk --release working-directory: fondblanc

uses: actions/upload-artifact@v4

with:

name: app-apk

path: fondblanc/build/app/outputs/flutter-apk/app-release.apk


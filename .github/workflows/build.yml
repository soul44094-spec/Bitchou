name: Build APK

on:

push:

branches:

main

workflow_dispatch:

jobs:

build:

runs-on: ubuntu-latest

steps:

name: Checkout

uses: actions/checkout@v4

Set up Java

uses: actions/setup-java@v4

with:

distribution: temurin java-version: '17

up Flutter

uses: subosito/flutter-action@v2

stable

ame: Create Flutter Android project un: flutter create --platforms=android --org com.test fondblanc

ame: Use app code

run: cp main.dart fondblanc/lib/main.dart

name: Build APK

working-directory: fondblanc

run: flutter build apk --release

name: Upload APK

uses: actions/upload-artifact@v4

name: app-apk

path: fondblanc/build/app/outputs/flutter-apk/app-release.apk
